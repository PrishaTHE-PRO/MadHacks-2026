<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Second Look stopped this site</title>
    <style>
      :root {
        --ink: #1f2330; --ink-2: #3a3f4e; --muted: #5b6070; --accent: #4f62c4; --accent-ink: #2f3c86;
        --high: #d9534f; --high-ink: #8e2a1a; --surface-2: #f0f1f3; --divider: #eceef1;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
        background:
          radial-gradient(70% 60% at 0% 0%, rgba(240,190,210,.28), transparent 60%),
          radial-gradient(60% 60% at 100% 10%, rgba(190,180,245,.30), transparent 60%),
          radial-gradient(60% 60% at 50% 100%, rgba(160,215,240,.28), transparent 60%), #fff;
      }
      main {
        width: 100%; max-width: 520px; background: #fff; border-radius: 20px; padding: 28px;
        box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 12px 36px rgba(16,24,40,.10);
        border-top: 4px solid var(--high);
      }
      .brand { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 14px; }
      h1 { margin: 0 0 6px; font-size: 24px; line-height: 1.25; color: var(--high-ink); }
      .domain { margin: 0 0 18px; font-size: 15px; color: var(--ink-2); overflow-wrap: anywhere; }
      .domain b { color: var(--ink); }
      ul { margin: 0 0 22px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
      li { display: flex; gap: 10px; align-items: flex-start; }
      li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--high); margin-top: 9px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      button {
        flex: 1 1 160px; height: 44px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
        border: 1px solid transparent;
      }
      .primary { background: var(--accent); color: #fff; }
      .primary:hover { background: #4456b3; }
      .quiet { background: var(--surface-2); color: var(--ink-2); font-weight: 500; }
      .quiet:hover { background: #e7e8eb; }
      .tip { margin: 22px 0 0; padding-top: 14px; border-top: 1px solid var(--divider); font-size: 13px; color: var(--muted); }
      .tip button { all: unset; cursor: pointer; color: var(--accent-ink); font-weight: 600; }
      .tip button:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main role="alert">
      <p class="brand">Second Look</p>
      <h1>We stopped this site</h1>
      <p class="domain"><b id="domain"></b></p>
      <ul id="reasons"></ul>
      <div class="row">
        <button class="primary" id="back">Go back</button>
        <button class="quiet" id="preview">Preview it safely</button>
      </div>
      <p class="tip">
        Protect all browsing: secure DNS with Cloudflare 1.1.1.2.
        <button id="dns">Open setting</button>
      </p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
